<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 432 432">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#1d2027"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.7" cy="1" r="1.1">
      <stop offset="0" stop-color="#151a20"/>
      <stop offset="0.6" stop-color="#05070a"/>
    </radialGradient>
  </defs>
  <!-- bezel fills the whole icon (iOS rounds the corners itself) -->
  <rect width="512" height="512" fill="#0b0d12"/>
  <!-- MFD bezel -->
  <rect x="40" y="40" width="432" height="432" fill="url(#bezel)"/>
  <rect x="76" y="43" width="360" height="3" rx="1.5" fill="#5a606c" opacity=".7"/>
  <!-- line select keys -->
  <g fill="#14161a" stroke="#4a4f59" stroke-width="2">
    <rect x="52" y="150" width="30" height="22" rx="4"/>
    <rect x="52" y="214" width="30" height="22" rx="4"/>
    <rect x="52" y="278" width="30" height="22" rx="4"/>
    <rect x="52" y="342" width="30" height="22" rx="4"/>
    <rect x="430" y="150" width="30" height="22" rx="4"/>
    <rect x="430" y="214" width="30" height="22" rx="4"/>
    <rect x="430" y="278" width="30" height="22" rx="4"/>
    <rect x="430" y="342" width="30" height="22" rx="4"/>
  </g>
  <g fill="#e8ebee">
    <rect x="59" y="159" width="16" height="4" rx="1"/>
    <rect x="59" y="223" width="16" height="4" rx="1"/>
    <rect x="59" y="287" width="16" height="4" rx="1"/>
    <rect x="59" y="351" width="16" height="4" rx="1"/>
    <rect x="437" y="159" width="16" height="4" rx="1"/>
    <rect x="437" y="223" width="16" height="4" rx="1"/>
    <rect x="437" y="287" width="16" height="4" rx="1"/>
    <rect x="437" y="351" width="16" height="4" rx="1"/>
  </g>
  <!-- screen -->
  <rect x="92" y="70" width="328" height="372" rx="14" fill="url(#glass)" stroke="#000" stroke-width="4"/>
  <!-- title bar -->
  <rect x="108" y="88" width="296" height="40" rx="3" fill="#f2f4f6"/>
  <text x="256" y="120" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" font-size="34" fill="#0b0d12" letter-spacing="1">A380</text>
  <!-- data lines: label (white) + value (cyan/green) like an FMS page -->
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="700">
    <text x="112" y="196" font-size="46" fill="#33b6f2">&lt;MFD</text>
    <text x="400" y="196" font-size="46" fill="#3fe06b" text-anchor="end">OZ</text>
  </g>
  <rect x="112" y="226" width="120" height="9" rx="3" fill="#a6afbc"/>
  <rect x="300" y="226" width="100" height="9" rx="3" fill="#a6afbc"/>
  <rect x="112" y="250" width="170" height="16" rx="4" fill="#33b6f2"/>
  <rect x="330" y="250" width="70" height="16" rx="4" fill="#3fe06b"/>
  <rect x="112" y="290" width="90" height="9" rx="3" fill="#a6afbc"/>
  <rect x="112" y="314" width="140" height="16" rx="4" fill="#f2a33a"/>
  <rect x="300" y="314" width="100" height="16" rx="4" fill="#33b6f2"/>
  <rect x="112" y="354" width="110" height="9" rx="3" fill="#a6afbc"/>
  <rect x="112" y="378" width="200" height="16" rx="4" fill="#3fe06b"/>
  <!-- CRT scanlines -->
  <g opacity=".18" fill="#000">
    <rect x="92" y="140" width="328" height="2"/><rect x="92" y="160" width="328" height="2"/>
    <rect x="92" y="180" width="328" height="2"/><rect x="92" y="200" width="328" height="2"/>
    <rect x="92" y="220" width="328" height="2"/><rect x="92" y="240" width="328" height="2"/>
    <rect x="92" y="260" width="328" height="2"/><rect x="92" y="280" width="328" height="2"/>
    <rect x="92" y="300" width="328" height="2"/><rect x="92" y="320" width="328" height="2"/>
    <rect x="92" y="340" width="328" height="2"/><rect x="92" y="360" width="328" height="2"/>
    <rect x="92" y="380" width="328" height="2"/><rect x="92" y="400" width="328" height="2"/>
  </g>
</svg>
